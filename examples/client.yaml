# CS_Tunnel Client 配置文件
# 用法: tunnel-client -c client.yaml

mode: client

client:
  listen: "127.0.0.1:443"           # 本地监听地址
  server: "vps.example.com:8888"    # Server 端地址
  password: "YourSecurePassword"    # 加密密码 (必须与 Server 一致)

  # 可选配置 (取消注释启用)
  # enable_ws: true                 # 启用 WebSocket 模式
  # ws_path: "/ws"                  # WebSocket 路径
  # daemon: true                    # 后台运行
  # log_path: "/var/log/client.log" # 日志文件
